version: "3.9"

networks:
  frontend-backend:
  monitoring:

volumes:
  mysqldata:
  grafana-storage:
  loki-data:

services:
  backend:
    build:
      context: ./Photomingle/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./Photomingle/backend:/app:rw
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - frontend-backend
    command: >
      /bin/sh -c "if [ \"$DEBUG\" = 'True' ]; then 
                    python manage.py runserver 0.0.0.0:8000;
                  else
                    gunicorn Photomingle.wsgi:application --bind 0.0.0.0:8000;
                  fi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "1000:1000"

  frontend:
    build:
      context: ./Photomingle/frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./Photomingle/frontend:/app:rw
    ports:
      - "3000:3000"
    networks:
      - frontend-backend
    command: >
      /bin/sh -c "if [ \"$DEBUG\" = 'True' ]; then 
                    npm run dev;
                  else
                    npm run build && npm run preview;
                  fi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "1000:1000"

  nginx:
    build:
      context: nginx/
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - frontend-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "101:101"

  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-photomingle}
      MYSQL_USER: ${MYSQL_USER:-photomingleuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    networks:
      - frontend-backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    security_opt:
      - no-new-privileges:true
    user: "999:999"

  loki:
    image: grafana/loki:2.9.1
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true -distributor.replication-factor=1
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - 3100:3100
    restart: always
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "65532:65532"

  grafana:
    image: grafana/grafana:10.0.5
    env_file:
      - .env
    ports:
      - "3001:3000"
    depends_on:
      - mysql
      - loki
    volumes:
      - grafana-storage:/var/lib/grafana:rw
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "472:472"

  promtail:
    image: grafana/promtail:2.9.1
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
    command:
      - '-config.file=/etc/promtail/config.yaml'
      - '-config.expand-env=true'
    restart: always
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:9080/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "65532:65532"
