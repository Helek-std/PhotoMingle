server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info
  # Включить runtime reload для безопасного обновления конфига
  enable_runtime_reload: true

positions:
  # Файл для хранения позиций чтения логов, чтобы не читать заново при рестарте
  filename: /tmp/positions.yaml

clients:
  # URL Loki с env-переменной для гибкости
  - url: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
    backoff_config:
      max_retries: 10
      min_period: 500ms
      max_period: 5s

scrape_configs:
  - job_name: system_logs
    static_configs:
      - targets:
          - localhost
        # Отслеживаем системные логи, типичные пути в Linux
        labels:
          job: system_logs
          __path__: /var/log/**/*.log

  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      # Лейблы для удобного фильтра и поиска в Grafana
      - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
      - source_labels: [__meta_docker_container_image]
        target_label: container_image
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
      - labels:
          level:
    # Сбор stdout и stderr из docker контейнеров
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker_containers
          __path__: /var/lib/docker/containers/*/*.log

# Глобальные метки, которые будут добавлены ко всем логам
global_labels:
  environment: ${ENVIRONMENT:-production}
  region: ${REGION:-us-east-1}
